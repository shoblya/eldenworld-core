name: Build EldenWorld Core M4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Reconstruct M3 source
        shell: bash
        run: |
          cat source_parts/m3_*.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip -d core
      - name: Apply M4 foundation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('core')
          def rep(path,a,b):
              p=root/path; s=p.read_text();
              if a not in s: raise SystemExit(f'target not found: {path}')
              p.write_text(s.replace(a,b))
          rep(Path('gradle.properties'),'mod_version=0.3.0-m3','mod_version=0.4.0-m4')
          rep(Path('build.gradle'),'archivesName = "EldenWorld-Core-${mod_version}"','archivesName = "EldenWorld-Core"')
          rep(Path('src/main/java/com/eldenworld/core/EldenWorldCore.java'),'EldenWorld Core M3 loaded: server-only PST progression + 18 keystone passive ability engine.','EldenWorld Core M4 loaded: server-only PST progression + 18 keystones + level-based keystone limits.')
          rep(Path('src/main/java/com/eldenworld/core/abilities/AbilityUtil.java'),'''    public static boolean has(ServerPlayer player, ResourceLocation skillId) {\n        return RequirementChecker.hasSkill(player, skillId);\n    }''','''    public static boolean has(ServerPlayer player, ResourceLocation skillId) {\n        if (player == null || player.isRemoved()) return false;\n        try {\n            return RequirementChecker.hasSkill(player, skillId);\n        } catch (NullPointerException ignored) {\n            return false;\n        }\n    }''')
          rep(Path('src/main/java/com/eldenworld/core/abilities/KeystoneAbilityEvents.java'),'''        if (event.phase != TickEvent.Phase.END || !(event.player instanceof ServerPlayer player)) {\n            return;\n        }\n        long now = player.level().getGameTime();''','''        if (event.phase != TickEvent.Phase.END || !(event.player instanceof ServerPlayer player)) {\n            return;\n        }\n        if (!player.isAlive() || player.isRemoved()) return;\n        long now = player.level().getGameTime();''')
          p=root/'src/main/java/com/eldenworld/core/abilities/KeystoneIds.java'; s=p.read_text()
          s=s.replace('import net.minecraft.resources.ResourceLocation;','import net.minecraft.resources.ResourceLocation;\n\nimport java.util.Set;')
          marker='''    public static final ResourceLocation SURVIVOR = id("skilltree:enchanter_subclass_2_mastery");\n'''
          add='''\n    public static final Set<ResourceLocation> ALL = Set.of(\n            SHADOWSTEP, GHOST, OPPORTUNIST,\n            JUGGERNAUT, UNYIELDING, SECOND_WIND,\n            KEEN_INSTINCT, WINDRUNNER, PATHFINDER,\n            ARCHMAGE, MANAFLOW, ARCANE_WARD,\n            MASTER_BUILDER, ENDURING_TOOLS, PROSPECTOR,\n            WAYFARER, TREASURE_HUNTER, SURVIVOR\n    );\n\n    public static boolean isKeystone(ResourceLocation id) { return ALL.contains(id); }\n'''
          if marker not in s: raise SystemExit('keystone marker missing')
          p.write_text(s.replace(marker,marker+add))
          (root/'src/main/java/com/eldenworld/core/abilities/KeystoneLimit.java').write_text('''package com.eldenworld.core.abilities;\n\nimport com.eldenworld.core.requirements.RequirementChecker;\nimport daripher.skilltree.capability.skill.IPlayerSkills;\nimport daripher.skilltree.capability.skill.PlayerSkillsProvider;\nimport net.minecraft.server.level.ServerPlayer;\n\npublic final class KeystoneLimit {\n    private KeystoneLimit() {}\n    public static int allowedSlots(int level) { if(level>=80)return 3; if(level>=60)return 2; if(level>=40)return 1; return 0; }\n    public static int nextSlotLevel(int level) { if(level<40)return 40; if(level<60)return 60; if(level<80)return 80; return -1; }\n    public static int learnedCount(ServerPlayer player) {\n        IPlayerSkills skills=PlayerSkillsProvider.get(player);\n        return (int)skills.getPlayerSkills().stream().filter(x->KeystoneIds.isKeystone(x.getId())).count();\n    }\n    public static int pstLevel(ServerPlayer player) { return RequirementChecker.pstLevel(player); }\n    public static boolean canLearnAnother(ServerPlayer player) { int l=pstLevel(player); return learnedCount(player)<allowedSlots(l); }\n}\n''')
          p=root/'src/main/java/com/eldenworld/core/mixin/LearnSkillMessageMixin.java'; s=p.read_text()
          s=s.replace('import com.eldenworld.core.requirements.NodeRequirement;','import com.eldenworld.core.abilities.KeystoneIds;\nimport com.eldenworld.core.abilities.KeystoneLimit;\nimport com.eldenworld.core.requirements.NodeRequirement;')
          needle='''        if (player == null) {\n            return;\n        }\n'''
          insert='''        if (player == null) {\n            return;\n        }\n\n        if (KeystoneIds.isKeystone(skillId) && !KeystoneLimit.canLearnAnother(player)) {\n            int level=KeystoneLimit.pstLevel(player);\n            int learned=KeystoneLimit.learnedCount(player);\n            int allowed=KeystoneLimit.allowedSlots(level);\n            int next=KeystoneLimit.nextSlotLevel(level);\n            context.setPacketHandled(true);\n            player.sendSystemMessage(Component.literal("Лимит ключевых нод: "+learned+"/"+allowed).withStyle(ChatFormatting.RED));\n            if(next>0) player.sendSystemMessage(Component.literal("Следующий слот откроется на PST уровне "+next+".").withStyle(ChatFormatting.YELLOW));\n            ci.cancel();\n            return;\n        }\n'''
          if needle not in s: raise SystemExit('mixin insertion missing')
          p.write_text(s.replace(needle,insert))
          PY
      - name: Build M4
        working-directory: core
        run: gradle build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: EldenWorld-Core-M4
          path: core/build/libs/*.jar
          if-no-files-found: error
