name: Extract M6.2 final sources

on:
  workflow_dispatch:
  push:
    branches: [ m6.2-final-build ]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6.2-final-build
          fetch-depth: 0

      - name: Extract packed M6.2 sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m62_final_src
          mkdir -p m62_final_src/current m62_final_src/overrides
          cat ci/m62_src_*.b64 > /tmp/m62.b64
          base64 -d /tmp/m62.b64 > /tmp/m62.tar.gz
          tar -xzf /tmp/m62.tar.gz -C m62_final_src/current

          base64 -d m62_tools/KeystoneAbilityEvents.java.gz.b64 | gzip -dc > m62_final_src/overrides/KeystoneAbilityEvents.java
          base64 -d m62_tools/IronsKeystoneEvents.java.gz.b64 | gzip -dc > m62_final_src/overrides/IronsKeystoneEvents.java
          base64 -d m62_tools/WorldScalingEvents.java.gz.b64 | gzip -dc > m62_final_src/overrides/WorldScalingEvents.java

          cat > m62_final_src/README.md <<'EOF'
          # EldenWorld M6.2 final source workspace

          This directory is generated once from the packed RC source so M6.2 FINAL can be edited and reviewed as normal text.

          - current/ = unpacked source bundle used by the RC workflow.
          - overrides/ = decompressed Java overrides from m62_tools.
          - The Passive Skill Tree topology is not to be redesigned for M6.2 FINAL.
          EOF

      - name: Commit extracted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m62_final_src
          if git diff --cached --quiet; then
            echo "No extracted-source changes."
            exit 0
          fi
          git commit -m "Expose M6.2 RC sources for finalization"
          git push origin HEAD:m6.2-final-build
